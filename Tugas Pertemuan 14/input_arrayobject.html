<!DOCTYPE html>
<html>
<head>
    <title>Data Mahasiswa</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Form Input Mahasiswa</h2>

    <form id="formMahasiswa">
        <label>NIM :</label>
        <input type="text" id="nim" required><br><br>

        <label>Nama :</label>
        <input type="text" id="nama" required><br><br>

        <label>Jurusan :</label>
        <input type="text" id="jurusan" required><br><br>

        <label>Fakultas :</label>
        <input type="text" id="fakultas" required><br><br>

        <button type="submit">Simpan</button>
    </form>

    <h2>Data Mahasiswa</h2>

    <table>
        <thead>
            <tr>
                <th>NIM</th>
                <th>Nama</th>
                <th>Jurusan</th>
                <th>Fakultas</th>
            </tr>
        </thead>
        <tbody id="tabelMahasiswa">
        </tbody>
    </table>

    <script>
        // Array Objek
        let mahasiswa = [];

        document.getElementById("formMahasiswa").addEventListener("submit", function(e){
            e.preventDefault();

            // Objek
            let data = {
                nim: document.getElementById("nim").value,
                nama: document.getElementById("nama").value,
                jurusan: document.getElementById("jurusan").value,
                fakultas: document.getElementById("fakultas").value
            };

            // Masukkan objek ke array
            mahasiswa.push(data);

            tampilkanData();

            this.reset();
        });

        function tampilkanData() {
            let tabel = document.getElementById("tabelMahasiswa");
            tabel.innerHTML = "";

            mahasiswa.forEach(function(mhs){
                tabel.innerHTML += `
                    <tr>
                        <td>${mhs.nim}</td>
                        <td>${mhs.nama}</td>
                        <td>${mhs.jurusan}</td>
                        <td>${mhs.fakultas}</td>
                    </tr>
                `;
            });
        }
    </script>

</body>
</html>
