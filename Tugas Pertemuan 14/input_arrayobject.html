<!DOCTYPE html>
<html>
<head>
    <title>Data Mahasiswa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2196f3 0%, #21cbf3 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            color: white;
            margin-top: 30px;
            margin-bottom: 20px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #2196f3 100%);
        }

        th {
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        tbody tr:hover {
            background-color: #f8f9ff;
            transition: background-color 0.3s;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h2>Form Input Mahasiswa</h2>

    <form id="formMahasiswa">
        <label>NIM :</label>
        <input type="text" id="nim" required><br><br>

        <label>Nama :</label>
        <input type="text" id="nama" required><br><br>

        <label>Jurusan :</label>
        <input type="text" id="jurusan" required><br><br>

        <label>Fakultas :</label>
        <input type="text" id="fakultas" required><br><br>

        <button type="submit">Simpan</button>
    </form>

    <h2>Data Mahasiswa</h2>

    <table>
        <thead>
            <tr>
                <th>NIM</th>
                <th>Nama</th>
                <th>Jurusan</th>
                <th>Fakultas</th>
            </tr>
        </thead>
        <tbody id="tabelMahasiswa">
        </tbody>
    </table>

    <script>
        // Array Objek
        let mahasiswa = [];

        document.getElementById("formMahasiswa").addEventListener("submit", function(e){
            e.preventDefault();

            // Objek
            let data = {
                nim: document.getElementById("nim").value,
                nama: document.getElementById("nama").value,
                jurusan: document.getElementById("jurusan").value,
                fakultas: document.getElementById("fakultas").value
            };

            // Masukkan objek ke array
            mahasiswa.push(data);

            tampilkanData();

            this.reset();
        });

        function tampilkanData() {
            let tabel = document.getElementById("tabelMahasiswa");
            tabel.innerHTML = "";

            mahasiswa.forEach(function(mhs){
                tabel.innerHTML += `
                    <tr>
                        <td>${mhs.nim}</td>
                        <td>${mhs.nama}</td>
                        <td>${mhs.jurusan}</td>
                        <td>${mhs.fakultas}</td>
                    </tr>
                `;
            });
        }
    </script>

</body>
</html>
